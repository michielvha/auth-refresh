name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: michielvha/go-ci-action@bc485542c70d6cf51da9642c632ef268571597db # main

  # The lane tests drive a real headless Chromium against a fake IdP. setup
  # fails if the downloaded browser cannot start, and AUTH_REFRESH_E2E=1 turns a
  # missing browser into a test failure, so this job cannot pass by skipping.
  # The runner image is pinned so the package names below stay valid.
  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The NEEDED libraries of the headless shell and Node.js, as listed in the
      # README, installed explicitly rather than assumed from the runner image.
      - name: Install Chromium's system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libnss3 libnspr4 libglib2.0-0t64 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libatspi2.0-0t64 libdbus-1-3 libx11-6 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxcb1 libxkbcommon0 libgbm1 libexpat1 libudev1 \
            libasound2t64 libstdc++6
      - name: Download the pinned Playwright driver and Chromium
        run: go run ./cmd/auth-refresh setup
      - name: No missing shared library
        run: |
          shell=$(ls ~/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          if ldd "$shell" | grep 'not found'; then exit 1; fi
      - name: Real-browser tests
        env:
          AUTH_REFRESH_E2E: '1'
        run: go test -count=1 -v -run 'TestLaneEndToEnd|TestProbe' ./internal/lane/
