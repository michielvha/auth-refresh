name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: michielvha/go-ci-action@bc485542c70d6cf51da9642c632ef268571597db # main

  # The only proof that the binary alone is enough: a pristine image with no Go,
  # Node, Python or browser, an unprivileged user, and the full lane lifecycle.
  fresh-host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ['ubuntu:24.04', 'debian:13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Fresh-host test
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/fresh-host-test.sh --image "$IMAGE"
